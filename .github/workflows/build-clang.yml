name: Build Custom LLVM/Clang (PGO + BOLT)

on:
  workflow_dispatch:

jobs:
  build-llvm:
    name: Compile LLVM Toolchain
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Manual Super Clean Disk
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/az
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/local/bin/aliyun /usr/local/bin/hazelcast
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          mkdir -p ../apt-cache/lists
          mkdir -p ../apt-cache/archives
          sudo mv /var/lib/apt/lists ../apt-cache/lists
          sudo mv /var/cache/apt/archives ../apt-cache/archives  
          sudo ln -s /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/../apt-cache/lists /var/lib/apt/lists
          sudo ln -s /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/../apt-cache/archives /var/cache/apt/archives
          df -h

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 ninja-build cmake zstd

      - name: Clone Official tc-build
        run: git clone --depth=1 https://github.com/ClangBuiltLinux/tc-build.git
          
      - name: Clone PGO Target Kernel (Vayu 16.0-bpf)
        run: |
          git clone --depth=1 -b 16.0-bpf https://github.com/Daffa06/android_kernel_xiaomi_sm8150.git pgo-kernel

      - name: Setup Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure Limit ccache
        run: |
          ccache -M 5G
          ccache -z

      - name: Build the LLVM Toolchain (Official Flags)
        run: |
          cd tc-build
          python3 build-llvm.py \
            --build-stage1-only \
            --check-targets "clang;lld;llvm" \
            --projects "clang;lld;llvm" \
            --targets "AArch64;ARM" \
            --pgo kernel \
            -L ../pgo-kernel \
            --lto thin \
            --bolt

      - name: Check ccache
        run: ccache -s

      - name: Compress Toolchain
        run: |
          cd tc-build/install
          tar -czvf ../../LLVM-toolchain-custom-clang.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLVM-Custom-Clang-PGO-BOLT
          path: LLVM-toolchain-custom-clang.tar.gz
          compression-level: 0
