name: Build Custom LLVM/Clang (Self-Hosted)

on:
  workflow_dispatch:

jobs:
  build-llvm:
    name: Compile LLVM Toolchain
    runs-on: self-hosted
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Mengarahkan ccache ke folder temporer di laptopmu
      CCACHE_DIR: /tmp/ccache_llvm
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build the LLVM Toolchain (Extreme Optimization)
        run: |
          if [ ! -d "tc-build" ]; then
            echo "📥 Mengunduh tc-build dari ClangBuiltLinux..."
            git clone https://github.com/ClangBuiltLinux/tc-build.git
          fi
          
          cd tc-build
          # Mengaktifkan ThinLTO, PGO, dan BOLT sekaligus untuk performa maksimal
          python3 build-llvm.py \
            --targets AArch64 ARM X86 \
            --lto thin \
            --pgo llvm \
            --bolt

      - name: Check ccache
        run: ccache -s || true

      - name: Strip & Clean Up Toolchain
        run: |
          cd tc-build/build/llvm/final
          
          echo "Ukuran sebelum dibersihkan:"
          du -sh .
          
          find . -name "*.a" -type f -delete
          rm -rf share/
          find bin/ -type f -executable -exec strip --strip-all {} + 2>/dev/null || true
          find lib/ -name "*.so*" -type f -exec strip --strip-unneeded {} + 2>/dev/null || true
          
          echo "Ukuran sesudah dibersihkan:"
          du -sh .

      - name: Compress Toolchain
        run: |
          cd tc-build/build/llvm/final
          # Menyimpan hasil kompresi di workspace agar mudah diakses
          env GZIP=-9 tar -czvf $GITHUB_WORKSPACE/LLVM-toolchain-custom-clang-Extreme.tar.gz .

      - name: Send Notification Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Sukses (PGO + BOLT Optimized)"
          else
            STATUS="❌ Gagal"
          fi
          
          MESSAGE="<b>Laporan Build Toolchain (Self-Hosted)</b>
          
          <b>Status:</b> ${STATUS}
          <b>Repository:</b> ${{ github.repository }}
          <b>Runner:</b> CachyOS Lokal
          
          <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">🔍 Klik untuk Lihat Detail Build</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_TO }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            -d text="$MESSAGE"
